<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidit Gupta — Contact</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --accent:#3CB939;
    --accent-hover:#2E9E2C;
    --text:#f2f4f8;
    --muted:#9aa3b2;
    --line:#262b35;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:32px 24px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .avatar{
    width:88px;height:88px;
    border-radius:50%;
    margin:0 auto 18px;
    background:linear-gradient(135deg,var(--accent),var(--accent-hover));
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:600;color:#fff;
  }
  h1{font-size:24px;font-weight:600;letter-spacing:-.01em;}
  .title{color:var(--muted);font-size:15px;margin-top:4px;}
  .company{color:var(--muted);font-size:14px;margin-top:2px;}
  .actions{margin-top:26px;display:flex;flex-direction:column;gap:12px;}
  a.btn,button.btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:15px 18px;border-radius:12px;
    font-size:16px;font-weight:600;cursor:pointer;
    text-decoration:none;border:1px solid var(--line);
    background:#20242e;color:var(--text);
    transition:transform .06s ease, background .15s ease;
  }
  a.btn:active,button.btn:active{transform:scale(.98);}
  a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  a.btn:hover,button.btn:hover{background:#2a2f3b;}
  a.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
  .ico{width:20px;height:20px;flex:none;}
  .foot{margin-top:22px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
  <main class="card">
    <div class="avatar" id="avatar">VG</div>
    <h1 id="name">Vidit Gupta</h1>
    <div class="title" id="title">[Your role / title]</div>
    <div class="company" id="company">[Your company]</div>

    <div class="actions">
      <button class="btn primary" onclick="saveContact()">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Save Contact
      </button>

      <a class="btn" href="mailto:vidit.gupta@ryzepower.com">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        Email
      </a>

      <a class="btn" id="linkedin" href="[YOUR_LINKEDIN_URL]" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
        LinkedIn
      </a>
    </div>

    <p class="foot">Tap Save Contact to add me to your phone.</p>
  </main>

<script>
  // ====== EDIT YOUR DETAILS HERE ======
  const contact = {
    firstName: "Vidit",
    lastName:  "Gupta",
    title:     "Project Engineer",
    company:   "Ryze Power",
    email:     "vidit.gupta@ryzepower.com",
    phone:     "+44 7947 899074",
    website:   "",
    linkedin:  "https://www.linkedin.com/in/vidit-gupta711"
  };
  // ====================================

  // Apply to the visible page
  (function render(){
    document.getElementById('name').textContent = contact.firstName + " " + contact.lastName;
    document.getElementById('avatar').textContent =
      (contact.firstName[0]||"") + (contact.lastName[0]||"");
    const t = document.getElementById('title');
    const c = document.getElementById('company');
    t.textContent = contact.title || "";
    c.textContent = contact.company || "";
    if(!contact.title) t.style.display = "none";
    if(!contact.company) c.style.display = "none";
    const li = document.getElementById('linkedin');
    if(contact.linkedin){ li.href = contact.linkedin; } else { li.style.display = "none"; }
  })();

  function saveContact(){
    let v = "BEGIN:VCARD\nVERSION:3.0\n";
    v += "N:" + contact.lastName + ";" + contact.firstName + ";;;\n";
    v += "FN:" + contact.firstName + " " + contact.lastName + "\n";
    if(contact.company) v += "ORG:" + contact.company + "\n";
    if(contact.title)   v += "TITLE:" + contact.title + "\n";
    if(contact.email)   v += "EMAIL;type=INTERNET;type=WORK:" + contact.email + "\n";
    if(contact.phone)   v += "TEL;type=CELL:" + contact.phone + "\n";
    if(contact.website) v += "URL:" + contact.website + "\n";
    if(contact.linkedin)v += "URL;type=LinkedIn:" + contact.linkedin + "\n";
    v += "END:VCARD";

    const blob = new Blob([v], {type:"text/vcard"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (contact.firstName + "_" + contact.lastName + ".vcf");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }
</script>
</body>
</html>
